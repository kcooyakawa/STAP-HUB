<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Stap · Registro de case</title><meta name="robots" content="noindex"><link rel="stylesheet" href="assets/css/hub.css"><style>
.demo{background:var(--navy);color:var(--bg);padding:12px var(--side);font-size:13px}
.job{display:flex;gap:16px;justify-content:space-between;align-items:baseline;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--navy);border-bottom:1px solid var(--hair);margin-bottom:40px}
.job b{font:italic 22px var(--serif);font-weight:400;color:var(--blue)}.job button{background:none;border:0;border-bottom:1px solid;padding:0;cursor:pointer;font:13px var(--sans);color:var(--navy)}
.lay{display:grid;grid-template-columns:240px minmax(0,1fr);gap:64px;align-items:start}
.steps{position:sticky;top:96px;list-style:none;margin:0;padding:0}
.steps button{display:grid;grid-template-columns:32px 1fr;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--hair);padding:13px 0;cursor:pointer;color:var(--muted);font:15px var(--sans)}
.steps i{font:italic 18px var(--serif);color:var(--blue)}.steps .on{color:var(--navy);border-color:var(--navy)}.steps small{display:block;grid-column:2;font-size:11px;color:var(--muted)}
.pane h2{font:400 clamp(36px,4vw,60px)/1 var(--serif);letter-spacing:-.02em;margin:0 0 10px}.pane>.who{color:var(--blue);margin-bottom:12px}.pane>.hint{color:var(--muted);max-width:60ch;margin:0 0 32px}
.g{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px}.f{display:flex;flex-direction:column;padding:14px 0 12px;border-bottom:1px solid var(--hair);min-width:0}.f.w{grid-column:1/-1}.f:focus-within{border-color:var(--blue)}
.f>span{font-size:13px}.f>small{font-size:12px;color:var(--muted)}
.f input,.f textarea,.f select{font:400 21px/1.3 var(--serif);border:0;background:transparent;color:var(--navy);padding:8px 0 2px;width:100%;min-width:0;border-radius:0}.f textarea{resize:vertical;min-height:84px}.f input:focus,.f textarea:focus,.f select:focus{outline:none}
.gt{grid-column:1/-1;font:italic 26px var(--serif);margin:36px 0 4px;color:var(--blue)}.gt small{font:12px var(--sans);color:var(--muted);display:block;margin-top:4px}
.ops{display:flex;gap:8px;flex-wrap:wrap;padding-top:10px}.ops label{cursor:pointer}.ops input{position:absolute;opacity:0;width:1px}.ops span{display:block;border:1px solid var(--navy);border-radius:999px;padding:9px 16px;font:13px var(--sans)}.ops input:checked+span{background:var(--navy);color:var(--bg)}.ops input:focus-visible+span{outline:2px solid var(--blue);outline-offset:2px}
.drop{border-top:1px solid var(--navy);padding:18px 0 22px}.drop h3{font:400 24px/1.1 var(--serif);margin:0}.drop p{margin:4px 0 12px;font-size:13px;color:var(--muted)}
.zone{display:block;border:1px dashed var(--navy);padding:24px;text-align:center;cursor:pointer;font-size:14px;transition:background .2s}.zone:hover,.zone.over{background:var(--paper)}.zone input{position:absolute;opacity:0;width:1px}
.fl{list-style:none;margin:10px 0 0;padding:0}.fl li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;font-size:13px;padding:7px 0;border-bottom:1px solid var(--hair)}.fl .nm{overflow-wrap:anywhere}.fl .st{color:var(--muted)}.fl .st.ok{color:var(--blue)}.fl button{background:none;border:0;border-bottom:1px solid;padding:0;font:12px var(--sans);cursor:pointer;margin-left:8px}
.fl .pg{grid-column:1/-1;height:2px;background:var(--hair)}.fl .pg b{display:block;height:100%;width:0;background:var(--blue)}
.nav{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:40px;align-items:center}#msg{font-size:13px;color:var(--blue);min-height:1.4em;margin-top:12px}
.gate{max-width:520px}.gate .btn{margin-top:24px}.gate .or{margin:36px 0 0;padding-top:20px;border-top:1px solid var(--hair)}
.pill{font-size:12px;color:var(--muted);margin-top:14px}
@media(max-width:860px){.lay{grid-template-columns:1fr;gap:28px}.steps{position:static;display:flex;overflow-x:auto;gap:18px}.steps li{flex:none}.steps button{grid-template-columns:auto;gap:0;padding:8px 0;border-bottom-width:2px}.steps small{display:none}.g{grid-template-columns:1fr}}
.tick{grid-column:1/-1;display:flex;gap:12px;align-items:center;padding:16px 0;border-bottom:1px solid var(--hair);cursor:pointer}.tick input{appearance:none;width:20px;height:20px;border:1px solid var(--navy);margin:0;flex:none;cursor:pointer}.tick input:checked{background:var(--blue);box-shadow:inset 0 0 0 3px var(--bg)}
.city{position:relative}.sug{position:absolute;z-index:5;top:100%;left:0;right:0;margin:0;padding:0;list-style:none;background:var(--paper);border:1px solid var(--navy);max-height:280px;overflow:auto}.sug button{width:100%;text-align:left;border:0;background:none;padding:10px 12px;font:15px var(--sans);cursor:pointer;color:var(--navy)}.sug button:hover{background:var(--bg)}
.pane .hint:empty{display:none}.pane h2{margin-bottom:24px}
.rs{border-top:1px solid var(--navy);padding:18px 0 28px}.rh{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:8px}.rh h3{font:400 26px var(--serif);margin:0}.rh button{background:none;border:0;border-bottom:1px solid;padding:0;cursor:pointer;font:13px var(--sans);color:var(--navy)}
.rr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:16px;padding:8px 0;border-bottom:1px solid var(--hair);font-size:14px}.rr span{color:var(--muted)}.rr b{font-weight:400;white-space:pre-wrap;overflow-wrap:anywhere}
@media(max-width:600px){.rr{grid-template-columns:1fr;gap:0}}@media print{.bar,.demo,.phead,.foot,.acts,.rh button{display:none}}

body{background:#fff}
.cover{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;gap:48px;padding-block:32px;color:#fff;background:url(assets/img/grunner-real.jpg) center/cover;overflow:hidden}
.film{position:absolute;inset:0;background:linear-gradient(105deg,rgba(7,17,31,.94) 0%,rgba(19,48,106,.78) 48%,rgba(31,79,168,.3) 100%)}
.cover>*:not(.film){position:relative}.top{display:flex;justify-content:space-between;gap:16px}
.cover h1{font:400 clamp(68px,13.2vw,230px)/.86 var(--serif);letter-spacing:-.035em;margin:auto 0}.cover h1 em{color:var(--light)}
.chain{list-style:none;margin:0;padding:18px 0 0;border-top:1px solid rgba(255,255,255,.55);display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.chain li{font:400 clamp(30px,5.4vw,92px)/1 var(--impact);text-transform:uppercase}.chain i{display:block;font:italic 18px var(--serif);text-transform:none;color:var(--light);margin-bottom:6px}
.form{padding-block:clamp(56px,8vw,112px)}#app{max-width:1280px;margin:auto}#msg{max-width:1280px;margin:12px auto 0}
.pane h2{font:400 clamp(48px,6.4vw,104px)/.95 var(--serif);letter-spacing:-.03em}.pane h2 em{color:var(--blue)}.pane>.who{font-size:11px}
.steps button{font:400 26px/1 var(--impact);text-transform:uppercase;color:#9aa5b1;padding:14px 0}.steps i{font:italic 17px var(--serif);text-transform:none}.steps .on{color:var(--blue);border-color:var(--blue)}
.f input,.f textarea,.f select{font-size:26px}.f>span{font-size:12px;letter-spacing:.04em;color:var(--muted)}.f:focus-within>span{color:var(--blue)}
.ops span{padding:12px 20px;font-size:14px}.ops input:checked+span{background:var(--blue);border-color:var(--blue);color:#fff}
.btn:not(.ghost){background:var(--blue);color:#fff}.btn:not(.ghost):hover{background:var(--navy)}.zone{background:linear-gradient(135deg,#fff,#E5F0FA);border-color:var(--blue);padding:36px}.zone:hover,.zone.over{background:#D3E2F2}
.tick input:checked{box-shadow:inset 0 0 0 3px #fff}.gate{max-width:640px}.sug{background:#fff}
@media(max-width:620px){.chain{grid-template-columns:1fr 1fr}.cover{background-position:60% center}}
@media print{.cover{display:none}}
</style></head>
<body>
<div class="demo" id="demo" hidden>Modo de teste: formulário ainda não conectado ao Drive. Nada do que você preencher será salvo.</div>
<section class="cover wrap"><div class="film"></div>
<div class="top lbl"><span>Registro de case</span><span>5 a 10 minutos</span></div>
<h1>Todo projeto<br><em>vira história.</em></h1>
<ol class="chain"><li><i>01</i>Precisava</li><li><i>02</i>Criou</li><li><i>03</i>Entregamos</li><li><i>04</i>Alcançamos</li></ol></section>
<section class="form wrap"><div id="app"></div><div id="msg" aria-live="polite"></div></section>
<footer class="foot wrap"><span>Sentimentos se constroem.</span><span>Uso interno · 2026</span></footer>
<script src="assets/js/registro.js"></script>
</body></html>
